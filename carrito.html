<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Carrito | VIDA SPA</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Karla:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="estilos.css">
</head>

<body>

  <header class="site-header">
    <a href="index.html" class="logo">
      <span class="logo-mark">VS</span>
      <span class="logo-text">VIDA SPA</span>
    </a>

    <a href="index.html#servicios" class="btn btn-outline">← Seguir eligiendo</a>
  </header>

  <main class="section checkout-page">

    <div class="checkout-shell">

      <section class="checkout-items">
        <div id="cart-items"></div>

        <p id="cart-empty" class="hidden">Tu carrito está vacío.</p>
      </section>

      <aside class="order-summary-panel">
        <h2>Datos de la persona que agenda</h2>

        <form id="checkout-form">
          <label for="nombre">Nombre completo</label>
          <input id="nombre" type="text" required placeholder="Camila Mendez">

          <label for="correo">Correo electrónico</label>
          <input id="correo" type="email" required placeholder="correo@ejemplo.com">

          <label for="telefono">Teléfono / WhatsApp</label>
          <input id="telefono" type="tel" required minlength="7" placeholder="0991234567">

          <label for="metodo-pago">Método de pago</label>
          <select id="metodo-pago" required>
            <option value="">Seleccione una opción</option>
            <option value="efectivo">Efectivo</option>
            <option value="transferencia">Transferencia bancaria</option>
            <option value="tarjeta">Tarjeta</option>
          </select>

          <div id="payment-panel" class="payment-panel hidden"></div>

          <div class="checkout-total-row">
            <span>Servicios</span>
            <strong id="sum-count">0</strong>
          </div>

          <div class="checkout-total-row total">
            <span>Total</span>
            <strong id="cart-total">$0.00</strong>
          </div>

          <p id="checkout-message"></p>

          <button type="button" id="checkout-btn" class="btn btn-primary" disabled>
            Confirmar cita por WhatsApp
          </button>

          <button type="button" id="cancel-order-btn" class="btn btn-outline" disabled>
            Vaciar carrito
          </button>
        </form>
      </aside>

    </div>

  </main>


<script type="module" src="carrito.js"></script>

</body>
</html>
